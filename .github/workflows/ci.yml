name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voice
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: voice_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice -d voice_tests"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://voice:test_only@127.0.0.1:5432/voice_tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check apps tests
      - run: uv run ruff format --check apps tests
      - run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
