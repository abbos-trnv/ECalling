[project]
name = "voice-analytics"
version = "0.1.0"
description = "Local voice analytics prototype"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "sqlalchemy>=2.0,<3",
  "fastapi>=0.121,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
